services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edtask_test
      POSTGRES_USER: edtask_test
      POSTGRES_PASSWORD: edtask_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${TEST_MINIO_PORT}:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "mkdir -p data/img data/files && uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://edtask_test:edtask_test@postgres:5432/edtask_test
      BOOTSTRAP_MASTER_TOKEN: test-admin
      BOOTSTRAP_MASTER_FULL_NAME: Test Admin
      BACKEND_PUBLIC_URL: http://127.0.0.1:${TEST_BACKEND_PORT}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: edtask-test-images
      MINIO_PUBLIC_URL: http://127.0.0.1:${TEST_MINIO_PORT}
      MINIO_SECURE: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      - "${TEST_BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
